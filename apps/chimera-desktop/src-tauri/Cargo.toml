[package]
name = "chimera-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Chimera++ 2.0 — Tauri 2 desktop shell"

[lib]
name = "chimera_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "chimera-desktop"
path = "src/main.rs"

[dependencies]
fs2 = { workspace = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-dialog = "2"
directories.workspace = true
url.workspace = true
uuid.workspace = true
toml_edit.workspace = true
chimera-domain = { path = "../../../crates/chimera-domain" }
chimera-provider = { path = "../../../crates/chimera-provider" }
chimera-migration = { path = "../../../crates/chimera-migration" }
chimera-theme = { path = "../../../crates/chimera-theme" }
chimera-runtime = { path = "../../../crates/chimera-runtime" }
chimera-platform = { path = "../../../crates/chimera-platform" }
chimera-update = { path = "../../../crates/chimera-update" }
codex-win-engine.workspace = true
codex-theme-engine.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile.workspace = true
