name: v2 release

# Chimera++ 2.0 release pipeline.
#
# ADR-008 decided this matches 1.x: NSIS on Windows with no Authenticode,
# ad-hoc codesign on macOS with no notarization, everything hosted on GitHub
# Releases. What v2 adds over 1.x is content signing — the manifests a client
# acts on are signed with our own ed25519 key and verified before anything is
# written to disk. That is the layer that decides which binary a user's machine
# downloads and executes, and it costs nothing.
#
# D6 (revised 2026-07-26): no official Codex payload is bundled. The client
# fetches it on first run. `test-bundle-contract.mjs` enforces that inversion
# against the built artifact, not just against intent.
#
# G10: releases are built and published only here, never from a workstation.

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and gate, but do not create a release"
        type: boolean
        default: true

permissions:
  contents: read

env:
  FRONTEND_DIR: apps/chimera-desktop

jobs:
  # Nothing is built until the same gates that guard every push have passed.
  # A release that skipped them would be the one build nobody verified.
  gates:
    name: Full verification (V1-V17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Run V2 Rust tests
        run: cargo test --locked -p chimera-domain -p chimera-platform -p chimera-provider -p chimera-runtime -p chimera-theme -p chimera-migration -p chimera-update -p mirror-contract

      - name: Run frontend typecheck and unit tests
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run check; npm test

      - name: V9 mirror contract
        run: node scripts/test-mirror-contract.mjs

      - name: V10 bundle contract (structural + self-test)
        run: node scripts/test-bundle-contract.mjs

      - name: Release tooling self-tests
        run: |
          node scripts/v2-release-manifest.mjs --self-test
          node scripts/sign-manifest.mjs --self-test

      - name: V11 license and third-party source registry
        run: node scripts/verify-license.mjs

      - name: V12 secret scan
        run: node scripts/verify-no-secrets.mjs

      - name: V15 architecture gate self-test
        run: node scripts/verify-v2-architecture.mjs --self-test

      - name: V15 architecture boundaries
        run: node scripts/verify-v2-architecture.mjs

      - name: V16 design tokens match .pen design file
        run: node scripts/verify-design-tokens.mjs

      - name: V17 i18n contract
        run: node scripts/verify-i18n.mjs

  windows:
    name: Windows x64 (NSIS, unsigned)
    needs: gates
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      # tauri.conf.json targets nsis only, so no WiX toolset download is needed.
      - name: Build installer
        working-directory: ${{ env.FRONTEND_DIR }}
        shell: pwsh
        run: |
          # Tauri downloads the NSIS helper DLL on demand. GitHub-hosted
          # Windows runners occasionally reset that connection; retry the
          # complete bundle step so the download can be attempted again.
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npm run build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $maxAttempts) { exit $LASTEXITCODE }
            Write-Host "Tauri bundle failed (attempt $attempt/$maxAttempts); retrying..."
            Start-Sleep -Seconds (15 * $attempt)
          }

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/windows
          installer="$(find target/release/bundle/nsis -name '*-setup.exe' -print -quit)"
          test -n "$installer"
          version="${GITHUB_REF_NAME#v}"
          cp "$installer" "dist/windows/ChimeraPlusPlus-${version}-windows-x64-setup.exe"
          cp NOTICE LICENSE dist/windows/
          cd dist/windows && sha256sum * > checksums.txt
          ls -la

      # The contract runs against what was actually produced. A payload that
      # crept back in is caught here, before anything is published.
      - name: V10 bundle contract (built artifact)
        run: node scripts/test-bundle-contract.mjs --dist dist/windows

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chimera-windows-x64
          path: dist/windows/
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (ad-hoc, not notarized)
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-apple-darwin
            runner: macos-15-intel
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          targets: ${{ matrix.target }}

      - name: Verify Rust target is installed
        shell: bash
        run: |
          set -euo pipefail
          rustup target list --installed | grep -Fx "${{ matrix.target }}"

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build app bundle
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build -- --target ${{ matrix.target }} --bundles app

      # Ad-hoc only, per ADR-008. Tauri can omit Contents/Resources when the
      # app has no bundled resource files; create the standard directory and
      # sign the final bundle explicitly before verifying it.
      - name: Ad-hoc sign and verify
        shell: bash
        run: |
          set -euo pipefail
          app="$(find target/${{ matrix.target }}/release/bundle/macos -name '*.app' -maxdepth 1 | head -1)"
          test -n "$app"
          mkdir -p "$app/Contents/Resources"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          echo "verified (ad-hoc only, NOT notarized — users must right-click → Open): $app"
          lipo -archs "$app/Contents/MacOS/"*

      - name: Create DMG with hdiutil
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/macos
          app="$(find target/${{ matrix.target }}/release/bundle/macos -name '*.app' -maxdepth 1 | head -1)"
          test -n "$app"
          version="${GITHUB_REF_NAME#v}"
          hdiutil create -volname "Chimera++" -srcfolder "$app" -ov -format UDZO \
            "dist/macos/ChimeraPlusPlus-${version}-macos-${{ matrix.arch }}.dmg"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find dist/macos -name '*.dmg' -print -quit)"
          test -n "$dmg"
          version="${GITHUB_REF_NAME#v}"
          test "$(basename "$dmg")" = "ChimeraPlusPlus-${version}-macos-${{ matrix.arch }}.dmg"
          cp NOTICE LICENSE dist/macos/
          cd dist/macos && shasum -a 256 * > checksums.txt
          ls -la

      - name: V10 bundle contract (built artifact)
        run: node scripts/test-bundle-contract.mjs --dist dist/macos

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chimera-macos-${{ matrix.arch }}
          path: dist/macos/
          if-no-files-found: error

  # The app's own update manifest. This is the part that IS signed, and the
  # reason ADR-008 could drop the certificates without weakening the update
  # path: a client verifies this signature before it will install anything.
  manifest:
    name: Sign the update manifest
    needs: [windows, macos]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist/

      - name: Manifest and signing self-tests
        run: |
          node scripts/v2-release-manifest.mjs --self-test
          node scripts/sign-manifest.mjs --self-test

      - name: Build chimera-app-latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          MINIMUM_SUPPORTED_VERSION: ${{ vars.MINIMUM_SUPPORTED_VERSION }}
        run: node scripts/v2-release-manifest.mjs --dist dist --out dist/chimera-app-latest.json

      - name: Build legacy updater manifest
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ "$version" != *-chimera.* ]]; then
            echo "error: release tag must use the legacy-compatible x.y.z-chimera.n form" >&2
            exit 1
          fi
          mkdir -p release-assets
          find dist -type f -name 'ChimeraPlusPlus-*.exe' -exec cp {} release-assets/ \;
          find dist -type f -name 'ChimeraPlusPlus-*.dmg' -exec cp {} release-assets/ \;
          MINIMUM_SUPPORTED_VERSION="$version" node scripts/release-manifest.mjs --generate release-assets

      # Stable releases fail closed without the production app trust key. A
      # beta build may be published unsigned solely for manual QA; the client
      # must refuse it for automatic installation and the release is marked
      # prerelease below.
      - name: Sign manifest
        env:
          CHIMERA_APP_SIGNING_KEY: ${{ secrets.CHIMERA_APP_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${CHIMERA_APP_SIGNING_KEY:-}" ]; then
            if [[ "$TAG" != *-beta.* && "$TAG" != *-alpha.* && "$TAG" != *-rc.* ]]; then
              echo "error: CHIMERA_APP_SIGNING_KEY is required for a stable release" >&2
              exit 1
            fi
            echo "::warning::publishing an unsigned prerelease for manual QA only"
            exit 0
          fi
          node scripts/sign-manifest.mjs \
            --in dist/chimera-app-latest.json \
            --out dist/chimera-app-latest.json.sig

      - name: Upload manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chimera-manifest
          path: |
            dist/chimera-app-latest.json*
            latest.json
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: manifest
    if: startsWith(github.ref, 'refs/tags/v2.') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist/

      # Draft, never auto-published. A human confirms the VM evidence in R6/R7
      # before anyone can download it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [[ "$TAG" == *-beta.* || "$TAG" == *-alpha.* || "$TAG" == *-rc.* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "Chimera++ $TAG" \
            $prerelease_flag \
            --notes "Cloud-built Chimera++ $TAG. Prereleases are for manual QA; automatic updates require a signed app manifest. Windows: SmartScreen may warn on first run. macOS: right-click → Open for the ad-hoc build." \
            $(find dist -type f | tr '\n' ' ')
