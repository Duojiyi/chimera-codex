name: Candidate Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch, or tag to build"
        required: true
        default: main
        type: string
      candidate_version:
        description: "Expected semantic version (without v)"
        required: true
        default: "2.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: chimera-candidate-${{ inputs.ref }}-${{ inputs.candidate_version }}
  cancel-in-progress: false

jobs:
  windows:
    name: Candidate Windows package
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record checked-out commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify candidate gates
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.candidate_version }}
        run: |
          node scripts/verify-release-version.mjs --expect "$env:EXPECTED_VERSION"
          pnpm format:check
          pnpm typecheck
          pnpm test:unit
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare Tauri signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/prepare-tauri-signing-key.sh

      - name: Build Windows candidate
        run: pnpm tauri build --bundles msi

      - name: Collect candidate evidence
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.candidate_version }}
          REQUESTED_REF: ${{ inputs.ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path candidate-assets | Out-Null
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if ($null -eq $msi) { throw 'Windows MSI was not produced' }
          Copy-Item $msi.FullName candidate-assets/
          Get-FileHash candidate-assets/* -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)"
          } | Set-Content candidate-assets/SHA256SUMS.txt
          pnpm list --prod --json | Set-Content candidate-assets/frontend-sbom.json
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 | Set-Content candidate-assets/rust-sbom.json
          @{
            candidateVersion = $env:EXPECTED_VERSION
            requestedRef = $env:REQUESTED_REF
            commit = $env:SOURCE_COMMIT
            platform = 'windows-x86_64'
          } | ConvertTo-Json | Set-Content candidate-assets/build-provenance.json

      - name: Upload Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chimera++-candidate-${{ inputs.candidate_version }}-windows-${{ steps.source.outputs.commit }}
          path: candidate-assets/
          if-no-files-found: error

  macos:
    name: Candidate macOS package
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record checked-out commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Add macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify candidate gates
        env:
          EXPECTED_VERSION: ${{ inputs.candidate_version }}
        run: |
          node scripts/verify-release-version.mjs --expect "$EXPECTED_VERSION"
          pnpm format:check
          pnpm typecheck
          pnpm test:unit
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare Tauri signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/prepare-tauri-signing-key.sh

      - name: Build universal macOS candidate
        run: pnpm tauri build --target universal-apple-darwin --bundles app

      - name: Collect candidate evidence
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.candidate_version }}
          REQUESTED_REF: ${{ inputs.ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p candidate-assets
          app_path=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$app_path"
          artifact_name="Chimera++-${{ inputs.candidate_version }}-macOS-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "candidate-assets/$artifact_name"
          (
            cd candidate-assets
            shasum -a 256 "$artifact_name" > SHA256SUMS.txt
          )
          pnpm list --prod --json > candidate-assets/frontend-sbom.json
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > candidate-assets/rust-sbom.json
          jq -n \
            --arg candidate_version "$EXPECTED_VERSION" \
            --arg requested_ref "$REQUESTED_REF" \
            --arg commit "$SOURCE_COMMIT" \
            --arg platform "darwin-universal" \
            '{candidateVersion: $candidate_version, requestedRef: $requested_ref, commit: $commit, platform: $platform}' \
            > candidate-assets/build-provenance.json

      - name: Upload macOS candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Chimera++-candidate-${{ inputs.candidate_version }}-macos-${{ steps.source.outputs.commit }}
          path: candidate-assets/
          if-no-files-found: error
