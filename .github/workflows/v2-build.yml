name: v2 build and gates

# Chimera++ 2.0 (v2 branch) CI.
#
# Deliberately separate from pr-build.yml, which targets the 1.x product
# (codex-plus-manager) and runs gates that no longer apply on v2 — notably
# test-sync-upstream.ps1, whose subject workflow (sync-upstream.yml) is
# removed on v2 per ADR: v2 does not follow CodexPlusPlus upstream tags.
#
# Ordering constraint: the frontend must be built before any cargo command
# that compiles apps/chimera-desktop, because Tauri's generate_context!
# resolves frontendDist at COMPILE time and dist/ is gitignored.
#
# Per ADR-007 the same Node/Rust entrypoints run on Windows and macOS;
# PowerShell is only used for Windows-specific operations.

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FRONTEND_DIR: apps/chimera-desktop

jobs:
  supply-chain:
    name: Supply chain and secret gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      # V15 runs dependency-cruiser for real, so the frontend deps must exist.
      # It refuses to skip when they are missing — an unrunnable gate is a
      # failed gate, which is how the App.tsx <-> TopRail cycle survived.
      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: V11 license and third-party source registry
        run: node scripts/verify-license.mjs

      - name: V12 secret scan
        run: node scripts/verify-no-secrets.mjs

      - name: V9 mirror contract
        run: node scripts/test-mirror-contract.mjs

      # D6 forbids shipping the Codex payload. This is the gate that would
      # notice it coming back, so it runs on every push, not only on release.
      - name: V10 bundle contract
        run: node scripts/test-bundle-contract.mjs

      - name: Release tooling self-tests
        run: |
          node scripts/v2-release-manifest.mjs --self-test
          node scripts/sign-manifest.mjs --self-test

      - name: V15 self-test (the gate must be able to go red)
        run: node scripts/verify-v2-architecture.mjs --self-test

      - name: V15 architecture boundaries
        run: node scripts/verify-v2-architecture.mjs

      - name: V16 design tokens match .pen design file
        run: node scripts/verify-design-tokens.mjs

      - name: V17 i18n contract
        run: node scripts/verify-i18n.mjs

      - name: V14 whitespace and text errors
        run: git diff --check ${{ github.event.pull_request.base.sha || 'HEAD~1' }} HEAD

  rust:
    name: Rust v2 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt

      - name: V1 Rust formatting
        run: cargo fmt --all -- --check

      # generate_context! reads frontendDist at compile time; dist/ is gitignored.
      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build frontend (required before cargo)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run vite:build

      - name: V2 chimera-domain
        run: cargo test -p chimera-domain --locked

      - name: V3 chimera-provider
        run: cargo test -p chimera-provider --locked

      - name: V4 chimera-runtime
        run: cargo test -p chimera-runtime --locked

      - name: V5 chimera-theme
        run: cargo test -p chimera-theme --locked

      - name: V6 chimera-migration
        run: cargo test -p chimera-migration --locked

      - name: chimera-update
        run: cargo test -p chimera-update --locked

      - name: chimera-platform
        run: cargo test -p chimera-platform --locked

      - name: mirror-contract
        run: cargo test -p mirror-contract --locked

      # V7 is scoped to the v2 crates enumerated above, not `cargo test
      # --workspace`. The 1.x suite is red on this branch by construction:
      # codex-plus-manager's `upstream_sync_*` and `release_gates_*` tests
      # assert on .github/workflows/sync-upstream.yml, which v2 deleted per ADR
      # (v2 does not follow CodexPlusPlus upstream tags). Those five failures
      # are the ADR working as intended, not a regression — and v2 must not
      # depend on the 1.x tree at all (G2, enforced by V15 check 1). Build the
      # shell to keep it compiling.
      - name: v2 desktop shell compiles
        run: cargo build -p chimera-desktop --locked

  frontend:
    name: Frontend v2 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: V8 TypeScript check
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run check

      - name: V8 behaviour tests
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm test

      - name: V8 production build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run vite:build

  # G16: zero serious/critical axe findings is a release gate, so it runs on
  # every push rather than on demand.
  #
  # Its own job, on one runner, for two reasons. The harness drives Chromium
  # via Playwright, so the result does not depend on the runner OS — running it
  # in the matrix would test the same thing twice. And Playwright lives in
  # scripts/design-verify, deliberately isolated from the app's package.json so
  # `npm ci` in the other jobs never pulls a browser; that isolation is why the
  # step has to install its own dependencies here.
  #
  # This checks structure and contrast, not the shipping webview. The per-
  # platform evidence R12 requires is the NVDA/VoiceOver smoke, which is manual.
  a11y:
    name: Accessibility (axe, WCAG 2.2 AA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      # The harness serves dist/ and loads each screen via ?screen=&lang=.
      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run vite:build

      - name: Install a11y harness dependencies
        working-directory: scripts/design-verify
        run: npm ci

      - name: Install Chromium
        working-directory: scripts/design-verify
        run: npx playwright install --with-deps chromium

      - name: V8 accessibility (axe, both shipped locales)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run test:a11y
