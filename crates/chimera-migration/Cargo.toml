[package]
name = "chimera-migration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Chimera++ 2.0 — read-only 1.x/CC Switch import, external manager detection"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
# v5: deterministic (namespace + name) provider ids in migrate.rs. Same
# (source_kind, source_id) always yields the same id, which is what lets a
# re-run recognise "already migrated" via a plain existence check instead of
# the ProviderSink needing to know anything about 1.x/CC Switch source ids.
uuid = { workspace = true, features = ["v5"] }
chimera-domain = { path = "../chimera-domain" }
# chimera-platform is layer 1 (ports over OS capabilities); reusing its file
# lock is allowed. chimera-provider/-runtime/-theme are sibling layer-2
# adapters and MUST NOT be added here (scripts/verify-v2-architecture.mjs G1) —
# narrow ports in src/ports.rs are the seam the desktop shell wires instead.
chimera-platform = { path = "../chimera-platform" }

[dev-dependencies]
tempfile = { workspace = true }
